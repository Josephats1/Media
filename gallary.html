<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Futuristic Photo Gallery</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2.8rem;
      text-align: center;
      color: #00fff7;
      text-shadow: 0 0 10px #00fff7, 0 0 20px #00fff7;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      width: 100%;
      max-width: 1200px;
    }

    .photo-card {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
      border: 2px solid rgba(0, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      transition: transform 0.4s ease, box-shadow 0.4s ease;
      cursor: pointer;
    }

    .photo-card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .photo-card:hover img {
      transform: scale(1.1);
    }

    /* Modal Styles */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.3s ease-in-out;
    }

    .modal-content {
      max-width: 90%;
      max-height: 90%;
      border-radius: 16px;
      border: 3px solid #00fff7;
      box-shadow: 0 0 25px #00fff7;
      animation: zoomIn 0.3s ease-in-out;
    }

    .close-btn {
      position: absolute;
      top: 30px;
      right: 40px;
      font-size: 2rem;
      color: #00fff7;
      cursor: pointer;
      z-index: 1001;
      text-shadow: 0 0 10px #00fff7;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes zoomIn {
      from { transform: scale(0.7); }
      to { transform: scale(1); }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

  <h1>Futuristic Photo Gallery</h1>

  <div class="gallery">
    <div class="photo-card"><img src="images/lds.png" alt="Futuristic 1" /></div>
    <div class="photo-card"><img src="images/Mathieu.png" alt="Futuristic 2" /></div>
    <div class="photo-card"><img src="images/Nero.png" alt="Futuristic 3" /></div>
    <div class="photo-card"><img src="https://source.unsplash.com/random/400x400?robot" alt="Futuristic 4" /></div>
    <div class="photo-card"><img src="https://source.unsplash.com/random/400x400?ai" alt="Futuristic 5" /></div>
    <div class="photo-card"><img src="https://source.unsplash.com/random/400x400?neon" alt="Futuristic 6" /></div>
  </div>

  <!-- Modal Structure -->
  <div class="modal" id="imageModal">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="modalImage" src="" alt="Enlarged image">
  </div>

  <script>
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImage");

    document.querySelectorAll(".photo-card img").forEach(img => {
      img.addEventListener("click", () => {
        modal.style.display = "flex";
        modalImg.src = img.src;
      });
    });

    function closeModal() {
      modal.style.display = "none";
    }

    window.addEventListener("click", (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });
  </script>

</body>
</html>
